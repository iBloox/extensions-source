name: Build WaveTeamy Extension

on:
  push:
    branches: [ "test-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build WaveTeamy extension
        run: ./gradlew :src:ar:waveteamy:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waveteamy-extension
          path: src/ar/waveteamy/build/outputs/apk/debug/*.apk
